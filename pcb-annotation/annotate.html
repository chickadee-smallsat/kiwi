<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiwi PCB Annotator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #16213e;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
  }

  header h1 { font-size: 1.1rem; font-weight: 600; color: #e94560; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  button {
    padding: 6px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.15s;
  }

  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #c73652; }
  .btn-secondary { background: #0f3460; color: #e0e0e0; border: 1px solid #1a5276; }
  .btn-secondary:hover { background: #1a5276; }
  .btn-danger { background: #7b241c; color: #fdd; border: 1px solid #a93226; }
  .btn-danger:hover { background: #a93226; }
  .btn-export { background: #1e8449; color: #fff; }
  .btn-export:hover { background: #27ae60; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .canvas-area {
    flex: 1;
    overflow: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .boards-row {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .board-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .board-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .canvas-wrapper {
    position: relative;
    cursor: crosshair;
    border: 2px solid #0f3460;
    border-radius: 4px;
    overflow: hidden;
    user-select: none;
  }

  .canvas-wrapper canvas {
    display: block;
  }

  /* SVG overlay sits on top of the image canvas */
  .canvas-wrapper svg.overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }

  .canvas-wrapper svg.overlay rect.annotation {
    pointer-events: all;
    cursor: pointer;
  }

  .canvas-wrapper svg.overlay rect.annotation:hover {
    stroke-width: 2.5;
    filter: drop-shadow(0 0 4px rgba(233,69,96,0.7));
  }

  .canvas-wrapper svg.overlay rect.draw-preview {
    pointer-events: none;
    fill: rgba(233,69,96,0.15);
    stroke: #e94560;
    stroke-width: 1.5;
    stroke-dasharray: 6 3;
  }

  .canvas-wrapper svg.overlay text.annotation-label {
    pointer-events: all;
    cursor: default;
  }
  body.ctrl-held .canvas-wrapper svg.overlay text.annotation-label {
    cursor: grab;
  }
  body.ctrl-held.label-dragging .canvas-wrapper svg.overlay text.annotation-label {
    cursor: grabbing;
  }

  /* Sidebar */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: #16213e;
    border-left: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid #0f3460;
  }

  .sidebar-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    color: #888;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }

  .sidebar-tab.active {
    color: #e94560;
    border-bottom-color: #e94560;
  }

  .sidebar-pane {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: none;
  }

  .sidebar-pane.active { display: block; }

  /* Form */
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #aaa;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 7px 9px;
    background: #0f1b2d;
    border: 1px solid #1a4a6e;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 0.85rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus { border-color: #e94560; }
  .form-group textarea { resize: vertical; min-height: 64px; }

  .form-hint {
    font-size: 0.72rem;
    color: #666;
    margin-top: 12px;
    line-height: 1.5;
  }

  /* Annotation list */
  .annotation-list { display: flex; flex-direction: column; gap: 6px; }

  .annotation-card {
    background: #0f1b2d;
    border: 1px solid #1a4a6e;
    border-radius: 4px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }

  .annotation-card:hover { border-color: #e94560; }
  .annotation-card.selected { border-color: #e94560; background: #1a1030; }

  .annotation-card__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .annotation-card__desig {
    font-size: 0.8rem;
    font-weight: 700;
    color: #e94560;
  }

  .annotation-card__board {
    font-size: 0.7rem;
    color: #666;
    background: #0f3460;
    padding: 1px 5px;
    border-radius: 3px;
  }

  .annotation-card__part {
    font-size: 0.78rem;
    color: #ccc;
    margin-top: 2px;
  }

  .annotation-card__desc {
    font-size: 0.73rem;
    color: #888;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .annotation-card__del {
    position: absolute;
    top: 6px;
    right: 6px;
    background: none;
    border: none;
    color: #555;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    line-height: 1;
  }
  .annotation-card__del:hover { color: #e94560; background: rgba(233,69,96,0.1); }

  .empty-state {
    color: #555;
    font-size: 0.82rem;
    text-align: center;
    padding: 24px 0;
    line-height: 1.7;
  }

  /* Status bar */
  #status-bar {
    background: #16213e;
    border-top: 1px solid #0f3460;
    padding: 4px 16px;
    font-size: 0.72rem;
    color: #666;
    flex-shrink: 0;
  }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    padding: 20px;
    width: 340px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 { font-size: 1rem; margin-bottom: 14px; color: #e94560; }

  .modal .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }

  /* Scale controls */
  .scale-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #888;
  }
  .scale-row input[type=range] {
    flex: 1;
    accent-color: #e94560;
  }
  #scale-label { min-width: 36px; text-align: right; }
</style>
</head>
<body>

<header>
  <h1>Kiwi PCB Annotator</h1>
  <div class="toolbar">
    <div class="scale-row">
      <span>Zoom:</span>
      <input type="range" id="scale-slider" min="0.3" max="2" step="0.05" value="1">
      <span id="scale-label">100%</span>
    </div>
    <button class="btn-secondary" onclick="loadImages()">&#8635; Reload Images</button>
    <button class="btn-secondary" onclick="loadAnnotations()">&#128194; Load JSON</button>
    <button class="btn-secondary" onclick="saveAnnotations()">&#128190; Save JSON</button>
    <button class="btn-export" onclick="exportViewer()">&#9654; Export Viewer</button>
  </div>
</header>

<div class="main">
  <div class="canvas-area">
    <div class="boards-row" id="boards-row">
      <!-- Front board -->
      <div class="board-panel">
        <div class="board-label">Front</div>
        <div class="canvas-wrapper" id="wrapper-front">
          <canvas id="canvas-front"></canvas>
          <svg class="overlay" id="svg-front"></svg>
        </div>
      </div>
      <!-- Back board -->
      <div class="board-panel">
        <div class="board-label">Back</div>
        <div class="canvas-wrapper" id="wrapper-back">
          <canvas id="canvas-back"></canvas>
          <svg class="overlay" id="svg-back"></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" onclick="showTab('tab-edit',this)">Edit</button>
      <button class="sidebar-tab" onclick="showTab('tab-list',this)">List</button>
    </div>

    <div class="sidebar-pane active" id="tab-edit">
      <p class="form-hint" id="edit-hint">Draw a rectangle on either PCB image to create an annotation.</p>
      <div id="edit-form" style="display:none">
        <div class="form-group">
          <label>Part Designation</label>
          <input type="text" id="f-desig" placeholder="e.g. U1, R4, C12">
        </div>
        <div class="form-group">
          <label>Part Number</label>
          <input type="text" id="f-partnum" placeholder="e.g. STM32F405RGT6">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="f-desc" placeholder="Brief description of the component…"></textarea>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn-primary" onclick="saveCurrentAnnotation()">Save</button>
          <button class="btn-danger" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="sidebar-pane" id="tab-list">
      <div class="annotation-list" id="annotation-list">
        <p class="empty-state">No annotations yet.<br>Draw rectangles on the PCB to add components.</p>
      </div>
    </div>
  </div>
</div>

<div id="status-bar">Ready — draw a rectangle on a PCB image to annotate a component.</div>

<!-- Edit existing annotation modal -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <h2>Edit Annotation</h2>
    <div class="form-group">
      <label>Part Designation</label>
      <input type="text" id="m-desig" placeholder="e.g. U1, R4, C12">
    </div>
    <div class="form-group">
      <label>Part Number</label>
      <input type="text" id="m-partnum" placeholder="e.g. STM32F405RGT6">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="m-desc" placeholder="Brief description…"></textarea>
    </div>
    <div class="actions">
      <button class="btn-danger" onclick="deleteModalAnnotation()">Delete</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveModalAnnotation()">Save</button>
    </div>
  </div>
</div>

<input type="file" id="file-input-images" accept="image/*" multiple style="display:none">
<input type="file" id="file-input-json" accept=".json" style="display:none">

<script>
// ─── State ──────────────────────────────────────────────────────────────────

const SIDES = ['front', 'back'];
const images = { front: null, back: null };
let annotations = [];     // [{id, side, x, y, w, h, designation, partNumber, description}]
let nextId = 1;
let scale = 1;

// Drawing state
let drawing = false;
let drawSide = null;
let drawStart = { x: 0, y: 0 };
let drawCurrent = { x: 0, y: 0 };
let pendingAnnotation = null;   // annotation being created (unsaved)
let editingId = null;           // id of annotation open in modal
let draggingLabel = null;       // {id, side, startMouseX, startMouseY, startLabelSVGX, startLabelSVGY}

// ─── Init ────────────────────────────────────────────────────────────────────

function init() {
  // Try to auto-load images from same directory
  loadImageFromSrc('front', 'kiwi_front.png');
  loadImageFromSrc('back', 'kiwi_back.png');

  // Scale slider
  const slider = document.getElementById('scale-slider');
  slider.addEventListener('input', () => {
    scale = parseFloat(slider.value);
    document.getElementById('scale-label').textContent = Math.round(scale * 100) + '%';
    rerenderAll();
  });

  // Global label drag handlers
  document.addEventListener('mousemove', onLabelDragMove);
  document.addEventListener('mouseup', onLabelDragEnd);

  // Ctrl key tracking for grab cursor hint
  document.addEventListener('keydown', e => { if (e.key === 'Control') document.body.classList.add('ctrl-held'); });
  document.addEventListener('keyup',   e => { if (e.key === 'Control') document.body.classList.remove('ctrl-held'); });
  window.addEventListener('blur', () => document.body.classList.remove('ctrl-held', 'label-dragging'));
}

// Compute scale so both boards fit side-by-side in the visible canvas area
function computeFitScale() {
  const canvasArea = document.querySelector('.canvas-area');
  const availW = canvasArea.clientWidth - 64;  // padding + gap between boards
  const perBoardW = availW / 2;
  const maxNatW = Math.max(
    images.front ? images.front.naturalWidth  : 1,
    images.back  ? images.back.naturalWidth   : 1
  );
  const availH = window.innerHeight - 80;  // minus header
  const maxNatH = Math.max(
    images.front ? images.front.naturalHeight : 1,
    images.back  ? images.back.naturalHeight  : 1
  );
  return Math.min(perBoardW / maxNatW, availH / maxNatH, 1);
}

function applyFitScale() {
  const fit = computeFitScale();
  // Round to 2 decimal places and clamp to slider range [0.05, 2]
  scale = Math.max(0.05, Math.min(2, Math.round(fit * 100) / 100));
  const slider = document.getElementById('scale-slider');
  // Widen the min if needed
  if (scale < parseFloat(slider.min)) slider.min = scale;
  slider.value = scale;
  document.getElementById('scale-label').textContent = Math.round(scale * 100) + '%';
}

function loadImageFromSrc(side, src) {
  const img = new Image();
  img.onload = () => {
    images[side] = img;
    // Recompute fit scale once we have at least one image
    applyFitScale();
    rerenderAll();
    setStatus(`Loaded ${src}`);
  };
  img.onerror = () => {
    setStatus(`Could not auto-load ${src} — use Reload Images to pick manually`);
  };
  img.src = src;
}

// ─── Rendering ───────────────────────────────────────────────────────────────

function rerenderAll() {
  SIDES.forEach(s => rerenderSide(s));
}

function rerenderSide(side) {
  const canvas = document.getElementById('canvas-' + side);
  const svg = document.getElementById('svg-' + side);
  const wrapper = document.getElementById('wrapper-' + side);
  const img = images[side];

  if (!img) {
    canvas.width = 480;
    canvas.height = 320;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0f1b2d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.font = '14px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('No image — click Reload Images', canvas.width / 2, canvas.height / 2);
  } else {
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
  }

  // Resize SVG overlay to match canvas
  svg.setAttribute('width', canvas.width);
  svg.setAttribute('height', canvas.height);
  svg.setAttribute('viewBox', `0 0 ${canvas.width} ${canvas.height}`);

  renderAnnotationsSVG(side);
  setupCanvasEvents(side);
}

function renderAnnotationsSVG(side) {
  const svg = document.getElementById('svg-' + side);
  // Remove existing annotation rects (keep draw-preview if any)
  [...svg.querySelectorAll('rect.annotation, text.annotation-label')].forEach(el => el.remove());

  const sideAnnotations = annotations.filter(a => a.side === side);
  sideAnnotations.forEach(a => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    const sx = a.x * scale, sy = a.y * scale, sw = a.w * scale, sh = a.h * scale;
    rect.setAttribute('x', sx);
    rect.setAttribute('y', sy);
    rect.setAttribute('width', sw);
    rect.setAttribute('height', sh);
    rect.setAttribute('fill', 'rgba(233,69,96,0.12)');
    rect.setAttribute('stroke', '#e94560');
    rect.setAttribute('stroke-width', '1.5');
    rect.classList.add('annotation');
    rect.dataset.id = a.id;
    rect.addEventListener('click', e => { e.stopPropagation(); openModal(a.id); });

    // Label
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const lx = (a.labelX !== undefined) ? a.labelX * scale : sx + 3;
    const ly = (a.labelY !== undefined) ? a.labelY * scale : sy - 3;
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('fill', '#e94560');
    text.setAttribute('font-size', Math.max(9, 11 * scale));
    text.setAttribute('font-family', 'system-ui, sans-serif');
    text.setAttribute('font-weight', '700');
    text.classList.add('annotation-label');
    text.dataset.id = a.id;
    text.textContent = a.designation || '?';
    text.addEventListener('click', e => { e.stopPropagation(); openModal(a.id); });
    text.addEventListener('mousedown', e => {
      if (!e.ctrlKey) return;
      e.stopPropagation();
      e.preventDefault();
      startLabelDrag(e, a, side);
    });

    svg.appendChild(rect);
    svg.appendChild(text);
  });
}

// ─── Canvas mouse events ─────────────────────────────────────────────────────

// Track abort controllers per side so we can cleanly remove old listeners
const _canvasAborts = {};

function setupCanvasEvents(side) {
  // Cancel previous listeners for this side
  if (_canvasAborts[side]) _canvasAborts[side].abort();
  const ac = new AbortController();
  _canvasAborts[side] = ac;
  const { signal } = ac;

  const w = document.getElementById('wrapper-' + side);

  w.addEventListener('mousedown', e => onMouseDown(e, side), { signal });
  w.addEventListener('mousemove', e => onMouseMove(e, side), { signal });
  w.addEventListener('mouseup',   e => onMouseUp(e, side),   { signal });
  w.addEventListener('mouseleave', e => { if (drawing && drawSide === side) cancelDrawing(side); }, { signal });
}

function getPos(e, side) {
  const wrapper = document.getElementById('wrapper-' + side);
  const rect = wrapper.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / scale,
    y: (e.clientY - rect.top) / scale
  };
}

function onMouseDown(e, side) {
  if (e.button !== 0) return;
  // Don't start drawing if clicking an annotation rect or label
  if (e.target.classList.contains('annotation')) return;
  if (e.target.classList.contains('annotation-label')) return;
  drawing = true;
  drawSide = side;
  drawStart = getPos(e, side);
  drawCurrent = { ...drawStart };
}

function onMouseMove(e, side) {
  if (!drawing || drawSide !== side) return;
  drawCurrent = getPos(e, side);
  renderPreview(side);
}

function onMouseUp(e, side) {
  if (!drawing || drawSide !== side) return;
  drawing = false;
  drawCurrent = getPos(e, side);

  const svg = document.getElementById('svg-' + side);
  // Remove preview
  const preview = svg.querySelector('.draw-preview');
  if (preview) preview.remove();

  const x = Math.min(drawStart.x, drawCurrent.x);
  const y = Math.min(drawStart.y, drawCurrent.y);
  const w = Math.abs(drawCurrent.x - drawStart.x);
  const h = Math.abs(drawCurrent.y - drawStart.y);

  if (w < 8 || h < 8) { drawSide = null; return; }

  // Create pending annotation
  pendingAnnotation = { id: nextId++, side, x, y, w, h, designation: '', partNumber: '', description: '' };

  // Show edit form in sidebar
  showTab('tab-edit', document.querySelector('.sidebar-tab'));
  document.getElementById('edit-hint').style.display = 'none';
  document.getElementById('edit-form').style.display = 'block';
  document.getElementById('f-desig').value = '';
  document.getElementById('f-partnum').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-desig').focus();

  // Render a pending rect
  renderPendingRect(side);
  setStatus(`Rectangle drawn on ${side} — fill in the annotation details and click Save.`);
  drawSide = null;
}

function renderPreview(side) {
  const svg = document.getElementById('svg-' + side);
  let preview = svg.querySelector('.draw-preview');
  if (!preview) {
    preview = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    preview.classList.add('draw-preview');
    svg.appendChild(preview);
  }
  const x = Math.min(drawStart.x, drawCurrent.x) * scale;
  const y = Math.min(drawStart.y, drawCurrent.y) * scale;
  const w = Math.abs(drawCurrent.x - drawStart.x) * scale;
  const h = Math.abs(drawCurrent.y - drawStart.y) * scale;
  preview.setAttribute('x', x);
  preview.setAttribute('y', y);
  preview.setAttribute('width', w);
  preview.setAttribute('height', h);
}

function renderPendingRect(side) {
  const svg = document.getElementById('svg-' + side);
  let pending = svg.querySelector('.pending-rect');
  if (!pending) {
    pending = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    pending.classList.add('pending-rect');
    pending.setAttribute('fill', 'rgba(255,200,0,0.15)');
    pending.setAttribute('stroke', '#f1c40f');
    pending.setAttribute('stroke-width', '1.5');
    pending.setAttribute('stroke-dasharray', '5 3');
    pending.setAttribute('pointer-events', 'none');
    svg.appendChild(pending);
  }
  const a = pendingAnnotation;
  pending.setAttribute('x', a.x * scale);
  pending.setAttribute('y', a.y * scale);
  pending.setAttribute('width', a.w * scale);
  pending.setAttribute('height', a.h * scale);
}

function cancelDrawing(side) {
  drawing = false;
  const svg = document.getElementById('svg-' + side);
  const preview = svg.querySelector('.draw-preview');
  if (preview) preview.remove();
}

// ─── Label drag ──────────────────────────────────────────────────────────────

function startLabelDrag(e, a, side) {
  const sx = a.x * scale, sy = a.y * scale;
  const startLabelSVGX = (a.labelX !== undefined) ? a.labelX * scale : sx + 3;
  const startLabelSVGY = (a.labelY !== undefined) ? a.labelY * scale : sy - 3;
  draggingLabel = {
    id: a.id,
    side,
    startMouseX: e.clientX,
    startMouseY: e.clientY,
    startLabelSVGX,
    startLabelSVGY,
  };
  document.body.classList.add('label-dragging');
}

function onLabelDragMove(e) {
  if (!draggingLabel) return;
  const dx = e.clientX - draggingLabel.startMouseX;
  const dy = e.clientY - draggingLabel.startMouseY;
  const newX = draggingLabel.startLabelSVGX + dx;
  const newY = draggingLabel.startLabelSVGY + dy;
  const svg = document.getElementById('svg-' + draggingLabel.side);
  const textEl = svg.querySelector(`text.annotation-label[data-id="${draggingLabel.id}"]`);
  if (textEl) {
    textEl.setAttribute('x', newX);
    textEl.setAttribute('y', newY);
  }
}

function onLabelDragEnd(e) {
  if (!draggingLabel) return;
  const dx = e.clientX - draggingLabel.startMouseX;
  const dy = e.clientY - draggingLabel.startMouseY;
  const newX = draggingLabel.startLabelSVGX + dx;
  const newY = draggingLabel.startLabelSVGY + dy;
  const a = annotations.find(x => x.id === draggingLabel.id);
  if (a) {
    a.labelX = newX / scale;
    a.labelY = newY / scale;
    setStatus(`Label for "${a.designation || a.id}" repositioned — save JSON to persist.`);
  }
  document.body.classList.remove('label-dragging');
  draggingLabel = null;
}

// ─── Annotation CRUD ─────────────────────────────────────────────────────────

function saveCurrentAnnotation() {
  if (!pendingAnnotation) return;
  pendingAnnotation.designation = document.getElementById('f-desig').value.trim();
  pendingAnnotation.partNumber = document.getElementById('f-partnum').value.trim();
  pendingAnnotation.description = document.getElementById('f-desc').value.trim();

  annotations.push(pendingAnnotation);
  const side = pendingAnnotation.side;

  // Remove pending visual
  const svg = document.getElementById('svg-' + side);
  const pending = svg.querySelector('.pending-rect');
  if (pending) pending.remove();

  pendingAnnotation = null;
  document.getElementById('edit-form').style.display = 'none';
  document.getElementById('edit-hint').style.display = '';

  renderAnnotationsSVG(side);
  renderList();
  setStatus(`Annotation saved — ${annotations.length} total.`);
}

function cancelEdit() {
  if (!pendingAnnotation) return;
  const side = pendingAnnotation.side;
  const svg = document.getElementById('svg-' + side);
  const pending = svg.querySelector('.pending-rect');
  if (pending) pending.remove();
  pendingAnnotation = null;
  document.getElementById('edit-form').style.display = 'none';
  document.getElementById('edit-hint').style.display = '';
  setStatus('Annotation cancelled.');
}

function openModal(id) {
  const a = annotations.find(x => x.id === id);
  if (!a) return;
  editingId = id;
  document.getElementById('m-desig').value = a.designation;
  document.getElementById('m-partnum').value = a.partNumber;
  document.getElementById('m-desc').value = a.description;
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingId = null;
}

function saveModalAnnotation() {
  const a = annotations.find(x => x.id === editingId);
  if (!a) return;
  a.designation = document.getElementById('m-desig').value.trim();
  a.partNumber = document.getElementById('m-partnum').value.trim();
  a.description = document.getElementById('m-desc').value.trim();
  closeModal();
  rerenderAll();
  renderList();
  setStatus('Annotation updated.');
}

function deleteModalAnnotation() {
  const idx = annotations.findIndex(x => x.id === editingId);
  if (idx === -1) return;
  const side = annotations[idx].side;
  annotations.splice(idx, 1);
  closeModal();
  renderAnnotationsSVG(side);
  renderList();
  setStatus('Annotation deleted.');
}

function deleteAnnotation(id) {
  const idx = annotations.findIndex(x => x.id === id);
  if (idx === -1) return;
  const side = annotations[idx].side;
  annotations.splice(idx, 1);
  renderAnnotationsSVG(side);
  renderList();
  setStatus('Annotation deleted.');
}

// ─── List rendering ──────────────────────────────────────────────────────────

function renderList() {
  const container = document.getElementById('annotation-list');
  if (annotations.length === 0) {
    container.innerHTML = '<p class="empty-state">No annotations yet.<br>Draw rectangles on the PCB to add components.</p>';
    return;
  }
  container.innerHTML = '';
  [...annotations].sort((a, b) => (a.designation || '').localeCompare(b.designation || '')).forEach(a => {
    const card = document.createElement('div');
    card.className = 'annotation-card';
    card.dataset.id = a.id;
    card.innerHTML = `
      <div class="annotation-card__header">
        <span class="annotation-card__desig">${esc(a.designation || '(unnamed)')}</span>
        <span class="annotation-card__board">${a.side}</span>
      </div>
      <div class="annotation-card__part">${esc(a.partNumber || '—')}</div>
      <div class="annotation-card__desc">${esc(a.description || '')}</div>
      <button class="annotation-card__del" title="Delete" onclick="event.stopPropagation();deleteAnnotation(${a.id})">✕</button>
    `;
    card.addEventListener('click', () => openModal(a.id));
    container.appendChild(card);
  });
}

// ─── Tab switching ────────────────────────────────────────────────────────────

function showTab(id, btn) {
  document.querySelectorAll('.sidebar-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // Find the correct tab button
  document.querySelectorAll('.sidebar-tab').forEach(b => {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(id)) b.classList.add('active');
  });
}

// ─── Save / Load JSON ─────────────────────────────────────────────────────────

function saveAnnotations() {
  const data = JSON.stringify({ annotations }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kiwi-annotations.json';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus('Annotations saved to kiwi-annotations.json');
}

function loadAnnotations() {
  const input = document.getElementById('file-input-json');
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        annotations = data.annotations || [];
        nextId = annotations.reduce((m, a) => Math.max(m, a.id + 1), 1);
        rerenderAll();
        renderList();
        setStatus(`Loaded ${annotations.length} annotations from ${file.name}`);
      } catch {
        alert('Invalid JSON file.');
      }
    };
    reader.readAsText(file);
    input.value = '';
  };
  input.click();
}

function loadImages() {
  const input = document.getElementById('file-input-images');
  input.multiple = true;
  input.onchange = () => {
    [...input.files].forEach(file => {
      const side = file.name.toLowerCase().includes('back') ? 'back' : 'front';
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          images[side] = img;
          applyFitScale();
          rerenderAll();
          setStatus(`Loaded ${file.name} as ${side}`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    input.value = '';
  };
  input.click();
}

<script>

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function buildBoard(side) {
  var info = IMAGES[side];
  if (!info || !info.url) return null;
  var panel = document.createElement('div');
  panel.className = 'board-panel';

  if (!text) return '';

  return parts.map(function(part, i) {
    if (i % 2 === 1) {
      var m = part.match(/<a\\s+href="(https?:\\/\\/[^"]+)"[^>]*>([\\s\\S]*?)<\\/a>/i);
      if (m) return '<a href="' + esc(m[1]) + '" target="_blank" rel="noopener">' + esc(m[2]) + '<\/a>';
      return esc(part);

    return part.split(/(\\[[^\\]]+\\]\\(https?:\\/\\/[^)]+\\)|https?:\\/\\/[^\\s<>"]+)/).map(function(p, j) {

    tbody.appendChild(tr);

})();
