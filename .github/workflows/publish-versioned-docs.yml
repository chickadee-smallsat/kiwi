name: Publish Versioned Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DOC_VERSION="${GITHUB_REF_NAME}"
          else
            DOC_VERSION="latest"
          fi
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "doc_version=${DOC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site for target version
        shell: bash
        run: |
          set -euo pipefail
          bundle exec jekyll build --baseurl "/${{ steps.vars.outputs.repo_name }}/${{ steps.vars.outputs.doc_version }}"

      - name: Checkout or init gh-pages
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --branch gh-pages --single-branch --depth 1 \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
              gh-pages
          else
            mkdir gh-pages
            git -C gh-pages init
            git -C gh-pages checkout --orphan gh-pages
          fi

      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euo pipefail
          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages remote get-url origin &>/dev/null || \
            git -C gh-pages remote add origin \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Publish version and update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.doc_version }}"
          mkdir -p "gh-pages/${VERSION}"
          rm -rf "gh-pages/${VERSION}"/*
          cp -R _site/. "gh-pages/${VERSION}/"

          # If this is a tagged build and latest/ has no real built content,
          # create/update a redirect so that /latest/ never 404s.
          # Once a real main-branch build populates latest/assets/, this is skipped.
          if [[ "$VERSION" != "latest" ]] && [[ ! -d "gh-pages/latest/assets" ]]; then
            mkdir -p "gh-pages/latest"
            cat > "gh-pages/latest/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=../${VERSION}/">
            <title>Redirecting — Kiwi Docs</title>
          </head>
          <body>
            <p>Redirecting to the latest pre-release documentation…</p>
            <p><a href="../${VERSION}/">Continue to ${VERSION}</a></p>
          </body>
          </html>
          HTML
          fi

          if [[ -f gh-pages/versions.json ]]; then
            cp gh-pages/versions.json /tmp/versions.json
          elif [[ -f versions.json ]]; then
            cp versions.json /tmp/versions.json
          else
            printf '["latest"]\n' > /tmp/versions.json
          fi

          jq --arg v "$VERSION" '
            if index($v) then . else . + [$v] end
            | map(select(. != "latest"))
            | sort
            | reverse
            | ["latest"] + .
          ' /tmp/versions.json > gh-pages/versions.json

          # Disable GitHub Pages Jekyll processing (content is pre-built)
          touch gh-pages/.nojekyll

          cat > gh-pages/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./latest/">
            <title>Kiwi Docs</title>
          </head>
          <body>
            <p>Redirecting to the latest documentation...</p>
            <p><a href="./latest/">Continue to latest</a></p>
          </body>
          </html>
          HTML

      - name: Commit and push gh-pages
        shell: bash
        run: |
          set -euo pipefail
          pushd gh-pages > /dev/null
          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish"
            popd > /dev/null
            exit 0
          fi
          git commit -m "docs: publish ${{ steps.vars.outputs.doc_version }}"
          git push origin HEAD:gh-pages
          popd > /dev/null

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.doc_version }}"
          DOCS_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${{ steps.vars.outputs.repo_name }}/${TAG}/"

          # vX.Y.Z (no suffix) → full release; anything else → pre-release
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_FLAGS="--latest"
          else
            RELEASE_FLAGS="--prerelease"
          fi

          NOTES="Documentation: ${DOCS_URL}"

          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" \
              --draft=false \
              $RELEASE_FLAGS \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --draft=false \
              $RELEASE_FLAGS \
              --notes "$NOTES"
          fi
