<aside class="theme-switcher" id="theme-switcher">
  <button class="theme-switcher__toggle" id="theme-toggle"
          aria-haspopup="true" aria-expanded="false" aria-controls="theme-panel"
          aria-label="Color theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5
               0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16
               c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5
               S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5
               S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5
               S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5
               S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </svg>
  </button>

  <div class="theme-switcher__panel" id="theme-panel" hidden role="group" aria-label="Select color theme">
    <p class="theme-switcher__heading">Color theme</p>

    <button class="theme-opt" data-theme="default" aria-pressed="true">
      <span class="theme-opt__dot" style="background:#0e3247;box-shadow:0 0 0 2px #7fd4f0"></span>
      Default
    </button>
    <button class="theme-opt" data-theme="deuteranopia" aria-pressed="false">
      <span class="theme-opt__dot" style="background:#0d2c52;box-shadow:0 0 0 2px #f5a428"></span>
      Deuteranopia-friendly
    </button>
    <button class="theme-opt" data-theme="high-contrast" aria-pressed="false">
      <span class="theme-opt__dot" style="background:#000;box-shadow:0 0 0 2px #ffff00"></span>
      High Contrast
    </button>
    <button class="theme-opt" data-theme="monochrome" aria-pressed="false">
      <span class="theme-opt__dot" style="background:#1e1e1e;box-shadow:0 0 0 2px #d0d0d0"></span>
      Monochrome
    </button>
  </div>

  <div aria-live="polite" aria-atomic="true" class="theme-switcher__announce" id="theme-announce"></div>
</aside>

<script>
(function () {
  var PREF_KEY = 'kiwi-color-theme';
  var labels = {
    'default': 'Default',
    'deuteranopia': 'Deuteranopia-friendly',
    'high-contrast': 'High Contrast',
    'monochrome': 'Monochrome'
  };

  var root    = document.documentElement;
  var toggle  = document.getElementById('theme-toggle');
  var panel   = document.getElementById('theme-panel');
  var opts    = document.querySelectorAll('.theme-opt');
  var announce = document.getElementById('theme-announce');

  function applyTheme(theme, shouldAnnounce) {
    if (theme && theme !== 'default') {
      root.dataset.theme = theme;
    } else {
      delete root.dataset.theme;
      theme = 'default';
    }
    opts.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.theme === theme));
    });
    if (shouldAnnounce && announce) {
      announce.textContent = '';
      // Force re-announcement with a slight delay
      setTimeout(function () {
        announce.textContent = 'Color theme changed to ' + (labels[theme] || theme);
      }, 50);
    }
    try { localStorage.setItem(PREF_KEY, theme); } catch (e) {}
    document.dispatchEvent(new CustomEvent('kiwi-theme', { detail: theme }));
  }

  // Sync button states with whatever theme was applied by the anti-FOUC script
  var saved;
  try { saved = localStorage.getItem(PREF_KEY) || 'default'; } catch (e) { saved = 'default'; }
  applyTheme(saved, false);

  // Toggle panel open/close
  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var opening = panel.hidden;
    panel.hidden = !opening;
    toggle.setAttribute('aria-expanded', String(opening));
    if (opening) {
      // Focus first option when opening
      var first = panel.querySelector('.theme-opt');
      if (first) first.focus();
    }
  });

  // Option selection
  opts.forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyTheme(btn.dataset.theme, true);
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    });
  });

  // Close on outside click
  document.addEventListener('click', function (e) {
    var sw = document.getElementById('theme-switcher');
    if (sw && !sw.contains(e.target)) {
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  // Close on Escape
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) {
      panel.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    }
  });
})();
</script>
