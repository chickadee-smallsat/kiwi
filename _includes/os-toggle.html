<div class="os-toggle-wrap{% if include.collapsible %} collapsible{% endif %}"{% if include.style %} style="{{ include.style }}"{% endif %}><div class="os-toggle" role="group" aria-label="Select version"><button type="button" class="os-toggle__btn is-active" data-target="#{{ include.id }}" data-src="{{ include.src1 | relative_url }}" data-alt="{{ include.alt1 }}">{{ include.label1 | default: "Windows 10" }}</button><button type="button" class="os-toggle__btn" data-target="#{{ include.id }}" data-src="{{ include.src2 | relative_url }}" data-alt="{{ include.alt2 }}">{{ include.label2 | default: "Windows 11" }}</button></div><img id="{{ include.id }}" src="{{ include.src1 | relative_url }}" alt="{{ include.alt1 }}"></div>
